name: Real Routing Validation
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

jobs:
  hanoi-golden-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Hanoi golden routes against TomTom
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: npm run validate:routing:real --workspace @app-map/api
